name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies and build
      run: |
        npm install
        npm run build
        
    - name: Create simple APK
      run: |
        mkdir -p apk-build
        cd dist
        zip -r ../app.apk .
        cd ..
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: teleprompter-app
        path: app.apk
        retention-days: 1
