name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm install
        
    - name: Build project
      run: npm run build
      
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Build APK using TWA
      run: |
        npx @bubblewrap/cli init --manifest=https://ai.studio/apps/driver17k9UUSE882MHeHHFWKpo91X0igabdfs/manifest.json
        npx @bubblewrap/cli build
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: teleprompter-apk
        path: ./*.apk
