name: Build Real APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies and build
      run: |
        npm install
        npm run build
        
    - name: Install PWA to APK tool
      run: npm install -g pwa2apk
      
    - name: Convert PWA to real APK
      run: |
        pwa2apk --url https://ai.studio/apps/driver17k9UUSE882MHeHHFWKpo91X0igabdfs --output teleprompter.apk
      
    - name: Upload real APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: teleprompter.apk
