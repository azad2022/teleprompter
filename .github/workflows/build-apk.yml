name: Build APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: |
          npm install
          npm run build
          cd dist
          zip -r ../my-app.apk .
      - uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: my-app.apk
