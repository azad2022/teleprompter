name: Build Real APK with TWA

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install and build project
      run: |
        npm install
        npm run build
        
    - name: Install Bubblewrap (Google's official tool)
      run: |
        npm install -g @bubblewrap/cli
        bubblewrap init --manifest=https://ai.studio/apps/driver17k9UUSE882MHeHHFWKpo91X0igabdfs/manifest.json --directory=./android-app
        
    - name: Build APK
      run: |
        cd android-app
        bubblewrap build
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: real-android-apk
        path: android-app/app-release-signed.apk
