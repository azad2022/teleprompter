name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-native-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Debug - List files
      run: ls -la
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        npm install
        npm list
      
    - name: Build project
      run: |
        echo "Building project..."
        npm run build
        ls -la dist/
      
    - name: Install Capacitor
      run: |
        npm install @capacitor/cli @capacitor/core @capacitor/android
        npx cap init Teleprompter com.teleprompter.app --web-dir dist
        npx cap add android
      
    - name: Debug - Check Android project
      run: |
        ls -la android/
        ls -la android/app/
      
    - name: Build APK with debug info
      run: |
        cd android
        chmod +x ./gradlew
        ./gradlew assembleDebug --stacktrace --info
      
    - name: Find APK files
      run: |
        find . -name "*.apk" -type f
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: |
          android/app/build/outputs/apk/debug/*.apk
          android/app/build/outputs/apk/release/*.apk
