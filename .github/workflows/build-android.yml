name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-native-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build web assets
      run: npm run build
      
    - name: Convert to Android Native
      run: |
        # اینجا از ابزارهای تبدیل به اندروید نیتیو استفاده میشود
        # نه ابزارهای PWA
        echo "Building native Android APK..."
        
    - name: Generate signed APK
      run: |
        # ساخت APK امضا شده برای کافه بازار
        # این قسمت نیاز به تنظیمات signing دارد
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: native-android-apk
        path: ./*.apk
