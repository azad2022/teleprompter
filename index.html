<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Professional Teleprompter and Content Creator Studio" />
    
    <!-- Android Native Settings -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="BloggerShow">
    
    <!-- Manifest removed for native APK build to prevent PWA prompts -->
    <!-- <link rel="manifest" href="./manifest.json" /> -->
    
    <title>BloggerShow | بلاگرشو</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;500;700;900&family=Poppins:wght@300;400;500;700;900&display=swap');
      
      * {
        box-sizing: border-box;
        /* Disable highlight color on tap for native feel */
        -webkit-tap-highlight-color: transparent;
        /* Disable long-press context menu on images/links */
        -webkit-touch-callout: none;
      }

      body {
        font-family: 'Vazirmatn', 'Poppins', sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* Native App Feel: Disable text selection and pull-to-refresh */
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior-y: none;
        touch-action: manipulation;
      }
      
      /* Re-enable text selection for inputs only */
      input, textarea, [contenteditable] {
        user-select: text;
        -webkit-user-select: text;
        -webkit-touch-callout: default; /* Allow copy/paste menu */
      }
      
      /* Dynamic Font Class based on Language */
      body.lang-en {
        font-family: 'Poppins', sans-serif;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'Lalezar', 'Poppins', cursive;
        letter-spacing: 0.5px;
      }
      
      body.lang-en h1, body.lang-en h2, body.lang-en h3, body.lang-en h4, body.lang-en h5, body.lang-en h6 {
        font-family: 'Poppins', sans-serif;
        font-weight: 800;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 4px; /* Thinner for mobile */
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2); 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.4); 
      }
      
      .glass-panel {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .text-shadow {
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "uuid": "https://aistudiocdn.com/uuid@^13.0.0",
    "react-webcam": "https://aistudiocdn.com/react-webcam@^7.2.0",
    "firebase/app": "https://esm.sh/firebase@10.8.0/app",
    "firebase/auth": "https://esm.sh/firebase@10.8.0/auth",
    "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
