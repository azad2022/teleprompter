<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>BloggerShow | بلاگرشو</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@300;400;500;700;900&family=Poppins:wght@300;400;500;700;900&display=swap');
      
      body {
        font-family: 'Vazirmatn', 'Poppins', sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Dynamic Font Class based on Language */
      body.lang-en {
        font-family: 'Poppins', sans-serif;
      }

      h1, h2, h3, h4, h5, h6 {
        font-family: 'Lalezar', 'Poppins', cursive; /* Professional TV/Cinema font */
        letter-spacing: 0.5px;
      }
      
      body.lang-en h1, body.lang-en h2, body.lang-en h3, body.lang-en h4, body.lang-en h5, body.lang-en h6 {
        font-family: 'Poppins', sans-serif;
        font-weight: 800;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2); 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.4); 
      }
      
      .glass-panel {
        background: rgba(15, 23, 42, 0.6); /* Darker for better contrast */
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .text-shadow {
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      }
    </style>
